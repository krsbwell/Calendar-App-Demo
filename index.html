<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendar</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
</head>
<body>
  <a href="#calendar-grid" class="skip-link">Skip to calendar</a>
  <div id="cal-live" aria-live="polite" aria-atomic="true" class="sr-only"></div>

  <!-- ===== Full-Width Top Header ===== -->
  <header id="top-header">
    <div id="top-header-left">
      <button id="btn-menu" aria-label="Menu">&#9776;</button>
      <div id="logo">
        <div id="logo-date"></div>
        <span id="logo-text">Calendar</span>
      </div>
      <button id="btn-today">Today</button>
      <button id="btn-prev" aria-label="Previous month">&#8249;</button>
      <button id="btn-next" aria-label="Next month">&#8250;</button>
      <h1 id="month-label"></h1>
    </div>
    <div id="top-header-right">
      <button class="hdr-icon" aria-label="Search">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M20.49 19l-5.73-5.73C15.53 12.2 16 10.91 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.41 0 2.7-.47 3.77-1.24L19 20.49 20.49 19zM5 9.5C5 7.01 7.01 5 9.5 5S14 7.01 14 9.5 11.99 14 9.5 14 5 11.99 5 9.5z"/></svg>
      </button>
      <button class="hdr-icon" aria-label="Help">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17h-2v-2h2v2zm2.07-7.75l-.9.92C13.45 12.9 13 13.5 13 15h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H8c0-2.21 1.79-4 4-4s4 1.79 4 4c0 .88-.36 1.68-.93 2.25z"/></svg>
      </button>
      <button class="hdr-icon" aria-label="Settings">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
      </button>
      <button id="btn-view-month" class="hdr-view-dropdown">Month <span class="dropdown-caret">&#9662;</span></button>
      <div class="hdr-view-group">
        <button class="hdr-view-btn hdr-view-active" aria-label="Month view" aria-pressed="true" title="Month view">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M20 3h-1V1h-2v2H7V1H5v2H4c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 18H4V8h16v13z"/></svg>
        </button>
        <button class="hdr-view-btn" aria-label="Tasks view" aria-pressed="false" title="Tasks">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-9 14l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
        </button>
      </div>
      <button class="hdr-upgrade">Upgrade</button>
      <button class="hdr-icon" aria-label="Google apps">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M6 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm6-10c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm6-14c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
      </button>
      <button id="btn-theme" aria-label="Switch to light mode">&#9728;</button>
      <div class="hdr-avatar" aria-hidden="true">K</div>
    </div>
  </header>

  <!-- ===== Two-Column Layout ===== -->
  <div id="layout">

    <!-- ===== Sidebar ===== -->
    <aside id="sidebar">

      <!-- + Create button -->
      <div id="sidebar-create-wrap">
        <button id="btn-create">
          <span class="create-icon">+</span>
          <span>Create</span>
          <span class="create-chevron">&#9662;</span>
        </button>
      </div>

      <!-- Mini calendar -->
      <div id="mini-cal">
        <div id="mini-cal-header">
          <span id="mini-cal-label"></span>
          <div class="mini-cal-nav">
            <button id="mini-prev" aria-label="Previous month">&#8249;</button>
            <button id="mini-next" aria-label="Next month">&#8250;</button>
          </div>
        </div>
        <div id="mini-cal-dow" aria-hidden="true">
          <span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span>
        </div>
        <div id="mini-cal-grid"></div>
      </div>

      <!-- Search for people -->
      <div id="sidebar-people-search">
        <svg class="people-icon" viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        <span>Search for people</span>
      </div>

      <!-- Booking pages -->
      <div class="sidebar-row">
        <span class="sidebar-row-text">Booking pages</span>
        <button class="sidebar-icon-btn" aria-label="Add booking page">+</button>
      </div>

      <div class="sidebar-divider"></div>

      <!-- My calendars -->
      <div class="sidebar-section-header">
        <span class="sidebar-section-title">My calendars</span>
        <button class="sidebar-icon-btn sidebar-collapse-btn" aria-label="Collapse My calendars">&#8963;</button>
      </div>
      <ul class="sidebar-cal-list">
        <li>
          <span class="cal-checkbox" style="background:#1a73e8">&#10003;</span>
          <span>FXPlebe</span>
        </li>
        <li>
          <span class="cal-checkbox" style="background:#0b8043">&#10003;</span>
          <span>Birthdays</span>
        </li>
        <li>
          <span class="cal-checkbox" style="background:#1a73e8">&#10003;</span>
          <span>Tasks</span>
        </li>
      </ul>

      <!-- Other calendars -->
      <div class="sidebar-section-header">
        <span class="sidebar-section-title">Other calendars</span>
        <button class="sidebar-icon-btn" aria-label="Add other calendar">+</button>
        <button class="sidebar-icon-btn sidebar-collapse-btn" aria-label="Collapse Other calendars">&#8963;</button>
      </div>

    </aside>

    <!-- ===== Main ===== -->
    <main id="main">
      <div id="day-headers" aria-hidden="true">
        <span>Sun</span>
        <span>Mon</span>
        <span>Tue</span>
        <span>Wed</span>
        <span>Thu</span>
        <span>Fri</span>
        <span>Sat</span>
      </div>
      <div id="calendar-grid" role="grid" aria-label="Calendar"></div>
    </main>

  </div>

  <!-- ===== Modal ===== -->
  <div id="modal-overlay" class="hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div id="modal">
      <h2 id="modal-title">Add Event</h2>
      <form id="event-form" novalidate>
        <input type="hidden" id="event-id">

        <div class="field">
          <label for="event-title">Title <span class="required">*</span></label>
          <input id="event-title" type="text" maxlength="80" autocomplete="off" placeholder="Event title">
          <span class="field-error" id="err-title" role="alert"></span>
        </div>

        <div class="field">
          <label for="event-date">Date <span class="required">*</span></label>
          <input id="event-date" type="date">
          <span class="field-error" id="err-date" role="alert"></span>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="event-start">Start time</label>
            <input id="event-start" type="time">
          </div>
          <div class="field">
            <label for="event-end">End time</label>
            <input id="event-end" type="time">
          </div>
        </div>
        <span class="field-error" id="err-time" role="alert"></span>

        <div class="field">
          <label for="event-desc">Description</label>
          <textarea id="event-desc" rows="3" maxlength="500" placeholder="Optional description"></textarea>
        </div>

        <div class="field">
          <label>Color</label>
          <div id="color-picker" role="radiogroup" aria-label="Event color">
            <label class="color-swatch evt-blue" title="Blue">
              <input type="radio" name="event-color" value="blue" checked>
              <span class="sr-only">Blue</span>
            </label>
            <label class="color-swatch evt-green" title="Green">
              <input type="radio" name="event-color" value="green">
              <span class="sr-only">Green</span>
            </label>
            <label class="color-swatch evt-red" title="Red">
              <input type="radio" name="event-color" value="red">
              <span class="sr-only">Red</span>
            </label>
            <label class="color-swatch evt-orange" title="Orange">
              <input type="radio" name="event-color" value="orange">
              <span class="sr-only">Orange</span>
            </label>
            <label class="color-swatch evt-purple" title="Purple">
              <input type="radio" name="event-color" value="purple">
              <span class="sr-only">Purple</span>
            </label>
            <label class="color-swatch evt-teal" title="Teal">
              <input type="radio" name="event-color" value="teal">
              <span class="sr-only">Teal</span>
            </label>
          </div>
        </div>

        <div id="modal-actions">
          <button type="button" id="btn-delete" class="btn-danger hidden">Delete</button>
          <div class="modal-actions-right">
            <button type="button" id="btn-cancel">Cancel</button>
            <button type="submit" id="btn-save" class="btn-primary">Save</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
